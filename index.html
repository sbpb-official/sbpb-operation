<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<style id="css">
/* Layout: quiet neutral header with logo top-left; working surfaces are soft greys (no pure white/black); club deep green and ball yellow-green only as point colors. */
:root{
  --bg:#F2F2F0; --surface:#FAFAF9; --surface-2:#EAEAE7; --ink:#252826; --muted:#6B6F6C; --line:#DDDDD9;
  --court:#1D5A3B; --court-soft:#E6E8E5; --on-court:#F7F7F4; --ball:#C9D94F; --ball-ink:#1E2A06;
  --ok:#2B8A3E; --warn:#B86E00; --bad:#C92A2A;
  --t-reg:#1D5A3B; --t-tour:#F76707; --t-ex:#1C7ED6; --t-mt:#7048E8; --t-etc:#868E96; --t-ind:#0CA678; --t-bd:#E64980; --star:#F59F00; --male:#6F93C0; --female:#D7939B; --bar:#8CB79A; --sf-grass:#2F9E44; --sf-hard:#1971C2; --sf-clay:#D9480F; --sat-soft:#4F77A3; --sun-soft:#B9645E;
  --logic-bg:#F1F7EE; --logic-line:#D5E6CD;
  --n-yellow:#FFE68C; --n-pink:#FFC6D3; --n-sky:#C3E3FF; --n-green:#D4EFB0; --note-ink:#2B2A26;
  --brand:#094027; --brand-2:#0F4E31; --brand-ink:#F6F1DF; --brand-muted:#A9C2B0;
  --gate-bg:#F9F4EB; --gate-field:#FFFCF6; --gate-line:#DED6C4; --gate-ink:#1E2A22; --gate-muted:#6E6A5E;
  --p-bg:#FAFAF8; --p-ink:#202422; --p-court:#1D5A3B; --p-line:#E0E0DB; --p-soft:#F0F0ED; --p-ball:#C9D94F;
  --f-display:"Archivo","IBM Plex Sans KR",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1B1D1C; --surface:#232625; --surface-2:#2C2F2E; --ink:#E4E6E3; --muted:#9A9E9B; --line:#373B39;
  --court:#86C49D; --court-soft:#303332; --on-court:#161817; --ball:#D3E35E; --ball-ink:#1E2A06;
  --ok:#69C47C; --warn:#E6A53C; --bad:#F06C6C;
  --t-reg:#86C49D; --t-tour:#FF922B; --t-ex:#4DABF7; --t-mt:#9775FA; --t-etc:#ADB5BD; --t-ind:#38D9A9; --t-bd:#F783AC; --star:#FFC53D; --male:#94B4DC; --female:#E8AAB1; --bar:#7FAE8E; --sf-grass:#69DB7C; --sf-hard:#74C0FC; --sf-clay:#FF8A4C; --sat-soft:#8BA9CB; --sun-soft:#CF8F89;
  --logic-bg:#1D2A22; --logic-line:#2D4636;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#1B1D1C; --surface:#232625; --surface-2:#2C2F2E; --ink:#E4E6E3; --muted:#9A9E9B; --line:#373B39;
  --court:#86C49D; --court-soft:#303332; --on-court:#161817; --ball:#D3E35E; --ball-ink:#1E2A06;
  --ok:#69C47C; --warn:#E6A53C; --bad:#F06C6C;
  --t-reg:#86C49D; --t-tour:#FF922B; --t-ex:#4DABF7; --t-mt:#9775FA; --t-etc:#ADB5BD; --t-ind:#38D9A9; --t-bd:#F783AC; --star:#FFC53D; --male:#94B4DC; --female:#E8AAB1; --bar:#7FAE8E; --sf-grass:#69DB7C; --sf-hard:#74C0FC; --sf-clay:#FF8A4C; --sat-soft:#8BA9CB; --sun-soft:#CF8F89;
  --logic-bg:#1D2A22; --logic-line:#2D4636;
  color-scheme:dark;
}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.25}
h2{font-size:18px;font-weight:700}
h3{font-size:15px;font-weight:700}
a{color:var(--court)}
:focus-visible{outline:2px solid var(--court);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;font-family:var(--f-display)}
.muted{color:var(--muted)}
.small{font-size:12px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--brand);color:var(--brand-ink)}
.top-in{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;padding-block:6px;text-decoration:none;color:var(--brand-ink)}
.brand img{height:58px;width:auto;display:block}
.brand .sub{font-size:12px;color:var(--brand-muted);letter-spacing:.04em;line-height:1.3;border-left:1px solid var(--brand-2);padding-left:12px}
.brand .sub b{display:block;color:var(--brand-ink);font-size:14px;letter-spacing:0}
.brand b{font-family:var(--f-display);font-stretch:80%;font-weight:800;font-size:22px;letter-spacing:.02em}
.brand span{display:block;font-size:11px;color:var(--muted);letter-spacing:.06em;margin-top:-3px}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.tabs::-webkit-scrollbar{display:none}
.tabs{align-self:stretch;align-items:stretch;min-height:48px}
.tabs a{padding:0 12px;display:flex;align-items:center;text-decoration:none;color:var(--brand-muted);font-weight:600;white-space:nowrap;border-bottom:3px solid transparent;border-top:3px solid transparent}
.tabs a[aria-current="page"]{color:var(--brand-ink);border-bottom-color:var(--ball)}
.tabs a:hover{color:var(--brand-ink)}
.tabs a:focus-visible{outline-color:var(--ball)}
.conn{font-size:12px;color:var(--brand-muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.conn i{width:8px;height:8px;border-radius:50%;background:var(--warn);display:inline-block}
.conn.on i{background:var(--ok)}

main{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 60px}
.banner{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;margin-bottom:16px;font-size:13px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.page-head h1{font-size:24px;font-weight:800}
.page-head p{margin:2px 0 0;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* controls */
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 13px;border-radius:8px;cursor:pointer;font-weight:600;white-space:nowrap}
a.btn{text-decoration:none;color:inherit;display:inline-block}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--court);border-color:var(--court);color:var(--on-court)}
.btn.ball{background:var(--ball);border-color:var(--ball);color:var(--ball-ink)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--surface-2)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.in,select.in,textarea.in{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;min-width:0;width:100%}
textarea.in{resize:vertical;min-height:70px}
label.f,div.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600;min-width:0}
label.f > .in,label.f > select,label.f > textarea{font-size:14px;color:var(--ink);font-weight:400}
/* 직접 입력한 값은 본문색, 고정 단위·안내만 회색 */
.f .in,.f .pickbtn,.f .lv-btn{color:var(--ink);font-weight:400}.f .pickbtn.ph,.f .in::placeholder{color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.check{display:flex;align-items:center;gap:8px;font-size:13px}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.panel-h a{font-size:12px;text-decoration:none;font-weight:600}
.empty{padding:28px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.empty .row{justify-content:center;margin-top:12px}

/* chips */
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--ink);white-space:nowrap}
.chip.court{background:var(--court-soft);color:var(--court)}
.chip.ball{background:var(--ball);color:var(--ball-ink)}
.chip.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.chip.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.t-정기모임{--tc:var(--t-reg)} .t-내부대회{--tc:var(--t-tour)} .t-교류전{--tc:var(--t-ex)} .t-MT{--tc:var(--t-mt)} .t-기타{--tc:var(--t-etc)} .t-개인대회{--tc:var(--t-ind)}
.tdot{background:var(--tc)}
.ttag{background:color-mix(in srgb,var(--tc) 16%,transparent);color:var(--tc)}
.dday{font-family:var(--f-display);font-weight:800;font-stretch:85%;font-variant-numeric:tabular-nums}
.stars{color:var(--star);letter-spacing:1px;white-space:nowrap}
.stars .off{color:var(--line)}
.stars .half{background:linear-gradient(90deg,var(--star) 50%,var(--line) 50%);-webkit-background-clip:text;background-clip:text;color:transparent}

/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600}
.kpi .v{font-family:var(--f-display);font-size:30px;font-weight:800;font-stretch:85%;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted)}
.dash{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.side{display:flex;flex-direction:column;gap:16px;min-width:0}
.year{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 16px}
.mon h4{margin:0 0 4px;font-family:var(--f-display);font-size:13px;font-weight:700}
.mon.cur h4{color:var(--court)}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px}
.mgrid span{font-size:10px;text-align:center;aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:4px;position:relative;font-variant-numeric:tabular-nums;color:var(--ink)}
.mgrid .wd{color:var(--muted);aspect-ratio:auto;padding-bottom:2px}
.mgrid .sun{color:var(--bad)}
.mgrid button{all:unset;cursor:pointer;font-size:10px;text-align:center;aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:4px;position:relative;font-variant-numeric:tabular-nums}
.mgrid button:focus-visible{outline:2px solid var(--court)}
.mgrid .ev{background:var(--tc);color:var(--surface);font-weight:700}
.mgrid .open::after{content:"";position:absolute;bottom:1px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--ball)}
.mgrid .reg{background:color-mix(in srgb,var(--t-reg) 11%,transparent);color:var(--t-reg);font-weight:700}
.mgrid .wd.satreg{color:var(--t-reg);font-weight:700}
.mgrid .bd::before{content:"";position:absolute;top:1px;right:1px;width:5px;height:5px;border-radius:50%;background:var(--t-bd)}
.legend .swatch{display:inline-block;width:14px;height:12px;border-radius:3px}
.mgrid .today{outline:1.5px solid var(--ink);outline-offset:-1.5px}
.mgrid .sel{box-shadow:0 0 0 2px var(--court)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:14px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.dayinfo{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);min-width:0}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.li .ttl{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .sub{font-size:12px;color:var(--muted)}
.li.click{cursor:pointer}
.bars{display:flex;flex-direction:column;gap:6px}
.bar{display:grid;grid-template-columns:62px 1fr 26px;gap:8px;align-items:center;font-size:12px}
.bar .tr{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.bar .fl{height:100%;background:var(--bar);border-radius:4px}
.split{display:flex;height:10px;border-radius:5px;overflow:hidden;margin:6px 0 4px;background:var(--surface-2)}

/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.tbl{border-collapse:collapse;width:100%;min-width:760px}
.tbl th{font-size:12px;color:var(--muted);text-align:left;font-weight:600;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap;cursor:pointer;user-select:none}
.in:disabled{opacity:.5;cursor:not-allowed;background:var(--surface-2)}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
table.tbl.mt{table-layout:fixed;min-width:980px}
.tbl.mt td,.tbl.mt th{overflow:hidden;text-overflow:ellipsis}
.tbl tr.dim td{opacity:.55}
.tbl tbody tr:hover td{background:color-mix(in srgb,var(--court-soft) 45%,transparent)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.toolbar .in{width:auto}
.toolbar .search{flex:1;min-width:160px;max-width:280px}

/* draw */
.draw{display:grid;grid-template-columns:370px minmax(0,1fr);gap:16px;align-items:start}
.draw .panel + .panel{margin-top:16px}
/* generation logic memo */
.logic{background:var(--logic-bg);color:var(--ink);border:1px solid var(--logic-line);border-radius:var(--r);padding:14px 18px;margin-bottom:16px;word-break:keep-all;overflow-wrap:break-word}
.logic summary{cursor:pointer;font-weight:700;font-size:15px;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--court)}
.logic summary::-webkit-details-marker{display:none}
.logic summary span{font-size:12px;font-weight:600;color:var(--muted)}
.logic ol{list-style:none;margin:12px 0 0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 24px;counter-reset:lg}
.logic li{counter-increment:lg;display:flex;flex-direction:column;gap:2px;font-size:13px;line-height:1.55;padding-left:26px;position:relative}
.logic li::before{content:counter(lg);position:absolute;left:0;top:1px;width:18px;height:18px;border-radius:50%;background:var(--court);color:var(--on-court);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;font-family:var(--f-display)}
.logic li b{font-weight:700;font-size:13.5px;color:var(--ink)}
.logic li span{color:var(--muted)}
.logic .edit{margin-top:14px;padding-top:12px;border-top:1px dashed var(--logic-line);font-size:13px;display:flex;flex-direction:column;gap:2px}
.logic .edit b{color:var(--ink)}
.logic .edit span{color:var(--muted)}
.plist{max-height:320px;overflow:auto;border:1px solid var(--line);border-radius:8px;margin-top:8px}
.plist .grp{font-size:11px;font-weight:700;color:var(--muted);padding:6px 10px;background:var(--surface-2);letter-spacing:.04em;position:sticky;top:0}
.plist label{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13px}
.plist label:last-child{border-bottom:0}
.plist label .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g-M{color:var(--male)} .g-F{color:var(--female)}
.need{margin-top:10px;padding:10px 12px;border-radius:8px;background:var(--surface-2);font-size:12px;line-height:1.6}
.need b{font-weight:700}
.need.warn{background:color-mix(in srgb,var(--warn) 14%,var(--surface))}
.courtrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stage{overflow-x:auto;background:var(--surface-2);border-radius:var(--r);padding:16px;border:1px solid var(--line)}
.stage-bar{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.hint{font-size:12px;color:var(--muted)}
.selbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--court);border-radius:8px;padding:8px 12px;margin-bottom:12px;font-size:13px}
.selbar b{color:var(--court)}
.pick-grp{font-size:12px;font-weight:700;color:var(--muted);margin:12px 0 6px}
.pick-list{display:flex;flex-wrap:wrap;gap:6px}
.pick-list button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;cursor:pointer;font-size:13px}
.pick-list button:hover{border-color:var(--court)}
.pick-list button small{color:var(--muted);margin-left:4px}

/* poster: fixed light palette; layout follows the club's weekly KakaoTalk bracket (time | courts | bench) */
.poster{word-break:keep-all;background:#FBFBF9;color:#1F2421;width:860px;padding:26px 26px 24px;font-family:var(--f-body);border-radius:6px}
.p-head{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.p-logo{height:62px;width:auto;flex:none;display:block}
.p-title{font-family:var(--f-display);font-size:24px;font-weight:800;line-height:1.2;color:#0B4428}
.p-meta{font-size:14px;color:#5B615D;margin-top:3px}
.p-status{margin-left:auto;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--p-ball);color:#1F2A05}
.p-status.draft{background:#E6E6E2;color:#5A5F5B}
.exporting .p-status{display:none}
.p-table{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed;border:1px solid #CDD4CF;border-radius:12px;overflow:hidden}
.p-table th{background:#0B4428;color:#F4F1E6;font-size:15px;padding:11px 6px;font-weight:600;letter-spacing:.02em}
.p-table th + th{border-left:1px solid rgba(244,241,230,.14)}
.p-table td{border-top:1px solid #DCE1DD;border-left:1px solid #DCE1DD;padding:13px 8px;text-align:center;vertical-align:middle}
.p-table td:first-child{border-left:0}
.p-table td.t{background:#F0F2EF}
.p-table td.t b{display:block;font-family:var(--f-display);font-size:21px;font-weight:800;color:#0B4428;line-height:1.1}
.p-table td.t span{display:block;font-size:11.5px;color:#6A706C;margin-top:4px;font-variant-numeric:tabular-nums}
.p-table td.bench{background:#FBFBF9;font-size:13.5px;color:#4A504C;line-height:1.75}
.p-table td.c-남복{background:#EDF4FC}.p-table td.c-여복{background:#FDF0EA}.p-table td.c-혼복{background:#EEF7E9}
.p-table td.c-미정,.p-table td.c-잡복,.p-table td.c-미완성{background:#F5F5F2}.p-table td.c-none{background:#F7F7F5;color:#A0A5A1;font-size:12px}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 11px;border-radius:999px;margin-bottom:7px;letter-spacing:.03em}
.tag.남복{background:#D3E3F6;color:#1F5C9E}.tag.여복{background:#F9D8CA;color:#B4441E}.tag.혼복{background:#D5EBC9;color:#2F7024}.tag.미정{background:#ECEDEA;color:#8A908C}.tag.잡복,.tag.미완성{background:#E5E7E4;color:#5B615D}
.m .tm{font-size:15px;font-weight:600;color:#1F2421;line-height:1.55}
.m .amp{color:#9AA09C;font-weight:500;margin:0 3px}
.m .vs{font-family:var(--f-display);font-size:10.5px;font-weight:700;color:#A3A9A5;letter-spacing:.14em;margin:1px 0}
.nm{white-space:nowrap;cursor:pointer;border-radius:5px;padding:0 3px;-webkit-user-select:none;user-select:none}
.nm:hover{background:rgba(201,217,79,.4)}
.nm.on{background:var(--p-ball);color:#1F2A05;box-shadow:0 0 0 2px #8FA020}
.p-table td.bench .nm{padding:0 1px}
.p-table td.bench .bl{display:block}
.gbadge{display:inline-block;width:17px;height:17px;line-height:17px;border-radius:50%;background:#E4E6E3;color:#4F5551;font-size:10.5px;font-weight:800;text-align:center;vertical-align:5px;margin-left:3px;font-family:var(--f-display)}
.nm.empty{display:inline-block;min-width:62px;color:#9A6A12;border:1.5px dashed #D6A84E;background:#FFF8E8;border-radius:6px;padding:1px 8px;font-size:12.5px;font-weight:600;box-shadow:inset 0 1px 3px rgba(120,80,0,.12);line-height:1.6}
.nm.empty:hover{background:#FFEFC8}
.exporting .nm{background:none!important;box-shadow:none!important}
.p-foot{margin-top:12px;display:flex;justify-content:flex-end}
.p-sign{font-family:var(--f-display);font-weight:700;color:#0B4428;white-space:nowrap;font-size:12px;opacity:.8}

/* slot menu, picker, disabled tip */
.slotmenu{position:absolute;z-index:15;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.2);padding:6px;min-width:200px;display:flex;flex-direction:column}
.slotmenu .sm-h{font-weight:700;padding:6px 10px 8px;border-bottom:1px solid var(--line);margin-bottom:4px}
.slotmenu .sm-h span{font-weight:500;color:var(--muted);font-size:12px;margin-left:4px}
.slotmenu button{all:unset;padding:10px;border-radius:6px;cursor:pointer;font-size:14px;color:var(--ink)}
.slotmenu button:hover,.slotmenu button:focus-visible{background:var(--surface-2)}
.slotmenu button.danger{color:var(--bad)}
.pk-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.pk-tools .in{flex:1;min-width:160px}
.pk-filters{display:flex;gap:4px;flex-wrap:wrap}
.pk-list{max-height:min(55vh,420px);overflow:auto;border:1px solid var(--line);border-radius:8px}
.pk-item{display:flex;align-items:center;gap:8px;width:100%;padding:10px 12px;border:0;border-bottom:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;text-align:left;font-size:14px}
.pk-item:last-child{border-bottom:0}
.pk-item:hover{background:var(--surface-2)}
.pk-item .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pk-st{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pk-st.bench{background:color-mix(in srgb,var(--court) 14%,var(--surface));color:var(--court)}
.pk-st.out{background:color-mix(in srgb,var(--t-ex) 12%,var(--surface));color:var(--t-ex)}
.tipwrap{position:relative;display:inline-flex}
.tipwrap button:disabled{pointer-events:none}
.tipwrap:hover::after,.tipwrap:focus-within::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 8px);right:0;background:var(--ink);color:var(--bg);font-size:12px;font-weight:600;padding:7px 11px;border-radius:7px;white-space:nowrap;z-index:6}
.emptywarn{font-size:12px;color:var(--warn);font-weight:600;width:100%;text-align:right}
/* star picker */
.starpick{display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:var(--ink);font-weight:400}
.sp-stars{display:flex}
.sp-star{position:relative;width:30px;height:32px;font-size:27px;line-height:32px;text-align:center}
.sp-g{pointer-events:none;color:var(--line)}
.sp-star.full .sp-g{color:var(--star)}
.sp-star.half .sp-g{background:linear-gradient(90deg,var(--star) 50%,var(--line) 50%);-webkit-background-clip:text;background-clip:text;color:transparent}
.sp-h{position:absolute;top:0;bottom:0;width:50%;border:0;background:transparent;cursor:pointer;padding:0;z-index:1}
.sp-h.l{left:0}.sp-h.r{right:0}
.sp-h:focus-visible{outline:2px solid var(--court);outline-offset:-2px;border-radius:4px}
.sp-desc{font-size:12px;color:var(--muted)}
.sp-unk{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer;color:var(--muted)}
.sp-unk[aria-pressed="true"]{background:var(--court);border-color:var(--court);color:var(--on-court)}

/* events */
.evwrap{display:grid;grid-template-columns:320px minmax(0,1fr);gap:16px;align-items:start}
.evlist .li{padding:10px 8px;border-radius:8px;border-bottom:0}
.evlist .li.on{background:var(--court-soft)}
.ev-sec{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.03em;padding:12px 8px 4px;border-top:1px solid var(--line);margin-top:4px}
.ev-sec:first-child{border-top:0;margin-top:0;padding-top:2px}
.ev-none{padding:6px 8px 10px}
.ev-more{width:100%;margin-top:4px}
.evlist .li:hover{background:var(--surface-2)}
.datebox{width:46px;text-align:center;flex:none;border-radius:8px;border:1px solid var(--line);background:var(--surface);padding:5px 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.datebox b{display:block;font-family:var(--f-display);font-size:18px;line-height:1.1;font-variant-numeric:tabular-nums}
.datebox span{display:block;font-size:10px;line-height:1.2;color:var(--muted)}
.datebox .db-w{font-weight:600;color:var(--ink);white-space:nowrap}.datebox .db-w.sat{color:var(--sat-soft)}.datebox .db-w.sun{color:var(--sun-soft)}
.evhead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start;padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:14px}
.evhead h2{font-size:22px}
.meta-row{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-top:6px}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px;margin-top:14px}
.note{background:var(--nc);color:var(--note-ink);padding:14px 14px 10px;min-height:150px;display:flex;flex-direction:column;gap:8px;box-shadow:0 1px 2px rgba(0,0,0,.12),0 6px 14px -8px rgba(0,0,0,.35);transform:rotate(var(--rot));transition:transform .15s;position:relative}
.note:hover{transform:rotate(0) translateY(-2px)}
.note .nt{white-space:pre-wrap;word-break:break-word;flex:1;font-size:14px;line-height:1.55}
/* memos: 3 lines with an ellipsis, tap to read the whole text */
.clamp{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;line-clamp:3;overflow:hidden;cursor:pointer}
.clamp.open{display:block;-webkit-line-clamp:unset;line-clamp:none}
.note .nt.clamp{flex:none;align-self:stretch}
.note .nf{margin-top:auto}
.note .nf{display:flex;justify-content:space-between;align-items:center;font-size:11px;opacity:.75;gap:6px}
.note .kind{font-size:11px;font-weight:700;opacity:.8}
.note .x{all:unset;cursor:pointer;font-size:12px;padding:0 4px;border-radius:4px}
.note .x:hover{background:rgba(0,0,0,.08)}
.nc-yellow{--nc:var(--n-yellow)}.nc-pink{--nc:var(--n-pink)}.nc-sky{--nc:var(--n-sky)}.nc-green{--nc:var(--n-green)}
.composer{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;background:var(--surface-2);padding:12px;border-radius:var(--r)}
.composer textarea{flex:1;min-width:200px}
.swatches{display:flex;gap:6px}
.sw{width:26px;height:26px;border-radius:6px;border:2px solid transparent;cursor:pointer;background:var(--nc)}
.sw[aria-pressed="true"]{border-color:var(--ink)}

/* courts */
.timeline{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.tl{flex:none;width:180px;border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;background:var(--surface)}
.tl .dday{font-size:22px;color:var(--court)}
.tl.res .dday{color:var(--t-tour)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px;margin-top:16px}
.ccard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.ccard .hd{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.ccard .hd h3{font-size:17px}
/* court badges: 바닥은 재질 색 (잔디 초록 · 하드 파랑 · 클레이 주황), 나머지는 키컬러 계열 */
.cbadges{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin-top:6px}
.cb{--bc:var(--court);display:inline-flex;align-items:center;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700;line-height:1.3;white-space:nowrap;color:var(--bc);background:color-mix(in srgb,var(--bc) 13%,var(--surface));border:1px solid color-mix(in srgb,var(--bc) 35%,transparent)}
.cb-area{background:var(--court);color:var(--on-court);border-color:var(--court)}
.cb-grass{--bc:var(--sf-grass)}.cb-hard{--bc:var(--sf-hard)}.cb-clay{--bc:var(--sf-clay)}
.cb-io{background:transparent}
.cb-etc{--bc:var(--muted)}
.cb-n{font-size:12px;font-weight:600;color:var(--muted);margin-left:2px}
a.addr{display:inline-flex;align-items:center;gap:3px;margin-top:4px;font-size:13px;color:var(--court);text-decoration:underline;text-underline-offset:2px;word-break:keep-all}
.kv{display:grid;grid-template-columns:76px 1fr;gap:4px 10px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;word-break:break-word}
.opens{display:grid;grid-template-columns:1fr;gap:8px}
.open-box{background:color-mix(in srgb,var(--court) 9%,var(--surface));border:1px solid color-mix(in srgb,var(--court) 25%,var(--line));border-left:4px solid var(--court);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:3px}
.open-box .l{font-size:12px;color:var(--court);font-weight:700}
.open-box .big{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;font-size:18px;color:var(--ink);line-height:1.3}
.open-box .big b{font-weight:800;font-variant-numeric:tabular-nums}
.open-box .big .dday{font-family:var(--f-display);font-size:26px;font-weight:800;color:var(--court);line-height:1}
.open-box.soon{border-left-color:var(--warn,#E8590C)}.open-box.soon .big .dday{color:var(--warn,#E8590C)}
.open-box .d{font-size:13px;color:var(--muted)}.open-box .d b{color:var(--ink);font-weight:700}
.prio{border-top:1px solid var(--line);padding-top:10px}
.prio .l{font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px}
.chips{display:flex;gap:4px;flex-wrap:wrap}


/* staff badge, member cards (phone), tournament */
.chip.staff{background:var(--brand);color:var(--brand-ink)}
.chip.staff.next{opacity:.45}/* 내년 운영진 (임기 전) */
.mcards{display:none;flex-direction:column;gap:8px}
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:4px;cursor:pointer}
.mcard.dim{opacity:.6}
.mcard .top1{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mcard .meta{font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.cf-chips,.px-chips{max-height:none}
.cf-add.px-add{width:auto;padding:0 12px;font-size:13px}
.cf-add{width:36px;height:30px;border-radius:999px;border:1.5px dashed var(--court);background:transparent;color:var(--court);font-size:18px;font-weight:700;line-height:1;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.cfx{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 4px 3px 10px;font-size:13px;background:var(--court);color:var(--on-court);border:1px solid var(--court)}
.cfx i{font-style:normal;font-size:10px;font-weight:700;opacity:.85;border:1px solid currentColor;border-radius:4px;padding:0 4px;height:16px;line-height:1;display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box}
.cfx button{all:unset;cursor:pointer;width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:14px;line-height:1}
.cfx-box{height:min(70vh,560px)}
.cfx-new{display:flex;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.cfx-new .in{flex:1;color:var(--ink)}
.cfx-sec{padding:10px 16px 4px;font-size:12px;font-weight:700;color:var(--muted)}
.cfx-list{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:0 8px 8px}
.cfx-list button{all:unset;box-sizing:border-box;display:block;width:100%;padding:11px 10px;border-radius:8px;cursor:pointer;color:var(--ink);font-size:14px}
.cfx-list button:hover{background:var(--surface-2)}
.conf-line span.ex{display:inline-flex;align-items:center;gap:3px}
.conf-line span.ex i{font-style:normal;font-size:9px;font-weight:700;color:var(--muted);border:1px solid currentColor;border-radius:4px;width:14px;height:14px;line-height:1;display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box}
.conf-line{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin-top:8px;font-size:12px}
.conf-line b{color:var(--court);margin-right:2px}
.conf-line span{border:1px solid color-mix(in srgb,var(--court) 40%,var(--line));background:color-mix(in srgb,var(--court) 10%,var(--surface));color:var(--ink);border-radius:999px;padding:2px 9px}
.cbchips{display:flex;flex-wrap:wrap;gap:6px;max-height:150px;overflow:auto;padding:2px}
.cbchips label{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:13px;cursor:pointer;background:var(--surface);color:var(--ink);font-weight:500}
.cbchips input{position:absolute;opacity:0;pointer-events:none}
.cbchips label:has(input:checked){background:var(--court);border-color:var(--court);color:var(--on-court)}
.cbchips label.off{background:var(--surface-2);border-color:var(--line);color:var(--muted);opacity:.55;cursor:not-allowed;text-decoration:line-through}
.cbchips label:has(input:focus-visible){outline:2px solid var(--court);outline-offset:2px}
fieldset.fs{border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:12px;margin:0}
fieldset.fs legend{font-size:12px;font-weight:700;color:var(--muted);padding:0 6px}
.tour{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;background:var(--surface-2);border-radius:var(--r);padding:12px 14px;margin-bottom:14px}
.tour .l{font-size:11px;color:var(--muted);font-weight:600}
.tour .v{font-weight:600}
.result{display:inline-block;font-family:var(--f-display);font-weight:800;font-size:15px;padding:3px 12px;border-radius:999px;background:var(--surface-2);color:var(--ink)}
.result:not(.win):not(.podium){padding:0;background:none}/* 일반 결과는 배경 없이 글자만: 앞 여백 없음 */
.result.win{background:var(--ball);color:var(--ball-ink)}
.result.podium{background:color-mix(in srgb,var(--t-ind) 18%,var(--surface));color:var(--t-ind)}
.cheer{border:1.5px dashed color-mix(in srgb,var(--t-ind) 55%,transparent);border-radius:var(--r);padding:12px 14px;margin-bottom:14px}
.cheer h3{display:flex;align-items:center;gap:8px}
.cheer .cnt{font-family:var(--f-display);font-size:22px;color:var(--t-ind)}
.cheer .toggle{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.cheer .toggle button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:12px;cursor:pointer;color:var(--muted)}
.cheer .toggle button[aria-pressed="true"]{background:color-mix(in srgb,var(--t-ind) 16%,var(--surface));border-color:var(--t-ind);color:var(--t-ind);font-weight:700}
.cheer .toggle .ch-on{border:1px solid var(--t-ind);background:color-mix(in srgb,var(--t-ind) 16%,var(--surface));color:var(--t-ind);font-weight:700;border-radius:999px;padding:4px 10px;font-size:12px}

/* password gate */
.locked .top,.locked main{display:none}
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--gate-bg);color:var(--gate-ink)}
.gate-card{width:100%;max-width:340px;display:flex;flex-direction:column;gap:14px;align-items:stretch;text-align:center}
.gate-card img{width:260px;max-width:78%;height:auto;margin:0 auto 6px;display:block}
.gate-card h2{color:var(--brand)}
.gate-card p{margin:0;color:var(--gate-muted);font-size:13px}
.gate-card .in{background:var(--gate-field);border-color:var(--gate-line);color:var(--gate-ink)}
.gate-card .btn{background:var(--gate-field);border-color:var(--gate-line);color:var(--gate-ink)}
.gate-card .btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.gate-card .err{color:var(--bad);font-size:13px;min-height:1.2em}
.pwrow{display:flex;gap:6px}
.pwrow .in{flex:1;font-size:16px}

/* level dropdown */
.lvsel{position:relative}
.lv-btn{display:flex;align-items:center;gap:8px;text-align:left;cursor:pointer;min-height:38px;font-weight:400}
.lv-n{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.lv-d{color:var(--ink);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.lv-unk{font-weight:700;color:var(--muted)}
.lv-caret{margin-left:auto;color:var(--muted);font-size:12px;padding-left:6px}
.lv-pop{position:absolute;z-index:30;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.18);max-height:300px;overflow:auto;padding:4px;min-width:240px}
.lv-pop button{all:unset;display:flex;gap:8px;align-items:center;width:100%;box-sizing:border-box;padding:10px;border-radius:6px;cursor:pointer;font-size:14px;color:var(--ink)}
.lv-pop button:hover,.lv-pop button:focus-visible{background:var(--surface-2)}
.lv-pop button[aria-selected="true"]{background:var(--court-soft);font-weight:700}
.lv-grp{font-size:11px;font-weight:700;color:var(--muted);padding:8px 10px 4px;letter-spacing:.04em}
/* pickers */
.pickrow{display:flex;gap:6px}.pickrow .in{flex:1;font-size:15px}
.pickbtn{display:flex;align-items:center;text-align:left;cursor:pointer;min-height:38px;font-weight:400;color:var(--ink)}
.pickbtn.ph{color:var(--muted)}
.wh-ov{overflow:hidden;overflow:clip;position:fixed;left:0;right:0;top:var(--vvt,0px);height:var(--vvh,100dvh);z-index:40;background:rgba(10,16,24,.45);display:flex;align-items:flex-end;justify-content:center}
.wh-sheet{background:var(--surface);width:100%;max-width:480px;border-radius:16px 16px 0 0;padding-bottom:max(12px,env(safe-area-inset-bottom,0px));box-shadow:0 -10px 30px rgba(0,0,0,.2)}
.wh-bar{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--line)}
.wh-bar b{font-size:15px}
.wh-cols{position:relative;display:flex;height:220px;padding:0 12px;overflow:hidden}

  appId: '1:950304660445:web:96bb61c81d64cffcec3434'
};
const SUPER = 'sbpb.official@gmail.com';   // club account: always an operator (must match firestore.rules)
const STAFF = 'staff@sbpb-official.github.io';   // shared operator login: the site password is this account's password (must match firestore.rules)

const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
let fs;
// ignoreUndefinedProperties: an empty optional field must never make a save fail
try { fs = initializeFirestore(fbApp, { ignoreUndefinedProperties: true, localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) }); }
catch (e) { fs = initializeFirestore(fbApp, { ignoreUndefinedProperties: true }); }

getRedirectResult(auth).catch(() => {});
let currentUser = null;
const authReady = new Promise(res => { const un = onAuthStateChanged(auth, u => { currentUser = u; un(); res(u); }); });

const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const markLogin = () => { try { localStorage.setItem('sbpb-login-day', today()); } catch (e) {} };
const withTimeout = (p, ms, fallback) => Promise.race([p, new Promise(r => setTimeout(() => r(fallback), ms))]);

async function adminList() {
  const s = await getDoc(doc(fs, 'config', 'admins'));
  return s.exists() ? (s.data().emails || []) : [];
}
let adminP = null;
function adminState() {
  return adminP || (adminP = authReady.then(async u => {
    if (!u || !u.email) return { u, ok: false };
    const email = u.email.toLowerCase();
    let ok = email === SUPER || email === STAFF;
    if (!ok) { try { ok = (await adminList()).map(x => String(x).toLowerCase()).includes(email); } catch (e) { ok = false; } }
    if (ok) setDoc(doc(fs, 'profiles', u.uid), { name: u.displayName || email.split('@')[0], email, at: Date.now() }).catch(() => {});
    return { u, ok };
  }));
}

const dbCap = {
  collection: col => ({
    doc: id => ({
      set: body => setDoc(doc(fs, col, id), body),
      delete: () => deleteDoc(doc(fs, col, id))
    }),
    onSnapshot: (next, err) => onSnapshot(collection(fs, col), { includeMetadataChanges: true }, s => next({ docs: s.docs, metadata: s.metadata }), err)
  })
};

function saveFile({ filename, data }) {
  const url = URL.createObjectURL(data);
  const a = document.createElement('a'); a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  return Promise.resolve();
}

window.claude = {
  use: async cap => {
    const st = await adminState();
    if (cap === 'db') return st.ok ? dbCap : null;
    if (cap === 'user') return st.u ? {
      can: async () => st.ok,
      id: async () => st.u.uid,
      profiles: async ids => {
        const out = {};
        await Promise.all(ids.map(async id => { try { const s = await getDoc(doc(fs, 'profiles', id)); if (s.exists()) out[id] = { name: s.data().name }; } catch (e) {} }));
        return out;
      }
    } : null;
    if (cap === 'downloads') return { save: saveFile };
    if (cap === 'artifact') return null;   // web app: no public copy, operators only
    return null;
  }
};

const inApp = /KAKAOTALK|Instagram|FBAN|FBAV|NAVER|Line\//i.test(navigator.userAgent);
window.SBPB_WEB = {
  SUPER,
  user: () => currentUser,
  state: adminState,
  async login() {
    if (/KAKAOTALK/i.test(navigator.userAgent)) { location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(location.href); return; }
    if (inApp) { alert('앱 안의 브라우저에서는 구글 로그인이 막혀 있습니다. 메뉴에서 "다른 브라우저로 열기"(Safari·Chrome) 후 로그인해 주세요.'); return; }
    const provider = new GoogleAuthProvider(); provider.setCustomParameters({ prompt: 'select_account' });
    try { await signInWithPopup(auth, provider); markLogin(); location.reload(); }
    catch (e) {
      if (e && (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment')) return signInWithRedirect(auth, provider);
      if (e && (e.code === 'auth/popup-closed-by-user' || e.code === 'auth/cancelled-popup-request')) return;
      throw e;
    }
  },
  logout: () => signOut(auth),
  async loginPw(pw) {
    try { await signInWithEmailAndPassword(auth, STAFF, pw); markLogin(); location.reload(); return ''; }
    catch (e) {
      const c = e && e.code || '';
      if (c === 'auth/too-many-requests') return '시도 횟수 초과. 잠시 후 재시도 필요';
      if (c === 'auth/network-request-failed') return '인터넷 연결 확인 필요';
      if (c === 'auth/operation-not-allowed' || c === 'auth/configuration-not-found') return '로그인 설정 미완료. 관리자 확인 필요';
      return '비밀번호 불일치. 다시 입력 필요';
    }
  },
  getAdmins: adminList,
  saveAdmins: emails => setDoc(doc(fs, 'config', 'admins'), { emails, at: Date.now() }),
  savePub: pub => setDoc(doc(fs, 'public', 'snapshot'), pub)
};

// auto-update: the home-screen app can keep an old page alive; check for a newer build and reload when idle
const CUR_APP = 'app.js?v=1d495bb0d5';
function busy() {
  const ae = document.activeElement;
  return !!((document.getElementById('modal-root') || {}).innerHTML || document.getElementById('wheel') || document.getElementById('daypop') || document.getElementById('cellpop') ||
    (ae && /INPUT|TEXTAREA|SELECT/.test(ae.tagName)));
}
let updating = false;
async function checkUpdate() {
  if (updating || document.visibilityState !== 'visible') return;
  try {
    const html = await (await fetch(location.pathname + '?check=' + Date.now(), { cache: 'no-store' })).text();
    const m = html.match(/app\.js\?v=([0-9a-f]+)/);
    if (!m || CUR_APP.endsWith(m[1])) return;
    updating = true;
    const go = () => location.replace(location.pathname + '?u=' + m[1] + location.hash);
    const wait = () => { if (!busy()) go(); else setTimeout(wait, 5000); };
    wait();
  } catch (e) {}
}
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkUpdate(); });
setInterval(checkUpdate, 120000);
setTimeout(checkUpdate, 15000);

// load the encrypted public snapshot, then start the app
(async () => {
  window.SBPB_PUB = {};   // operators read live data after Google sign-in; no public copy
  const m = document.getElementById('boot-msg'); if (m) m.remove();
  const sc = document.createElement('script'); sc.id = 'app'; sc.src = 'app.js?v=1d495bb0d5';
  sc.onerror = () => { document.body.insertAdjacentHTML('afterbegin', '<p style="padding:24px;font:14px system-ui">앱을 불러오지 못했습니다. 새로고침해 주세요.</p>'); };
  document.body.appendChild(sc);
})();

</script>
</body>
